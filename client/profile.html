<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>My Profile | ZeroTraceAnalytics</title>

    <link rel="stylesheet" href="css/style.css" />

    <link rel="stylesheet" href="css/profile.css" />
  </head>

  <body>
    <header class="profile-header">
      <div class="logo">ZERO<span>TRACE</span></div>

      <a href="dashboard.html">
        <button>← Dashboard</button>
      </a>
    </header>

    <section class="profile-container">
      <div class="profile-card">
        <h1>👤 My Profile</h1>

        <div class="profile-info">
          <p>
            <strong>Name:</strong>

            <span id="profileName"> Loading... </span>
          </p>

          <p>
            <strong>Email:</strong>

            <span id="profileEmail"> Loading... </span>
          </p>

          <p>
            <strong>Role:</strong>

            <span id="profileRole"> Loading... </span>
          </p>

          <p>
            <strong>VIP Status:</strong>

            <span id="profileVipStatus"> Loading... </span>
          </p>
        </div>
      </div>

    <script src="js/config.js"></script>

<script src="js/profile.js"></script>

<script src="js/auth.js"></script>
  </body>
</html>
